<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>YOUMBIA — Prévisualisation Lifecycle Email P0</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#0F172A; color:#F8FAFC; }
    h1 { padding:24px 16px 8px; font-size:20px; }
    .grid { display:grid; gap:24px; padding:16px; }
    @media (min-width: 1100px) { .grid { grid-template-columns: 1fr 1fr; } }
    section { background:#1E293B; border-radius:16px; padding:16px; }
    h2 { margin:0 0 12px; font-size:15px; color:#94A3B8; }
    .frames { display:flex; flex-wrap:wrap; gap:16px; }
    .desk, .phone { background:#F8FAFC; border-radius:12px; overflow:hidden; }
    .desk { width:100%; max-width:680px; height:720px; }
    .phone { width:390px; height:720px; border:10px solid #334155; border-radius:28px; }
    iframe { width:100%; height:100%; border:0; background:#F8FAFC; }
  </style>
</head>
<body>
  <h1>Prévisualisation — moteur d’envoi Lifecycle (renderLifecycleEmail)</h1>
  <div class="grid">
    <section>
      <h2>1 · Bienvenue — desktop / mobile</h2>
      <div class="frames">
        <div class="desk"><iframe src="01-welcome.html" title="welcome desktop"></iframe></div>
        <div class="phone"><iframe src="01-welcome.html" title="welcome mobile"></iframe></div>
      </div>
    </section>
    <section>
      <h2>2 · Première annonce — desktop / mobile</h2>
      <div class="frames">
        <div class="desk"><iframe src="02-first-listing.html" title="listing desktop"></iframe></div>
        <div class="phone"><iframe src="02-first-listing.html" title="listing mobile"></iframe></div>
      </div>
    </section>
    <section>
      <h2>3 · Brouillon abandonné — desktop / mobile</h2>
      <div class="frames">
        <div class="desk"><iframe src="03-abandoned-draft.html" title="draft desktop"></iframe></div>
        <div class="phone"><iframe src="03-abandoned-draft.html" title="draft mobile"></iframe></div>
      </div>
    </section>
  </div>
</body>
</html>
